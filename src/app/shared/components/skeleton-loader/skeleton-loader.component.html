<div class="animate-pulse space-y-4">
  @if (variant === 'stat') {
    @for (i of rowsArray; track i) {
      <div class="h-24 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
    }
  } @else if (variant === 'card') {
    @for (i of rowsArray; track i) {
      <div class="p-4 bg-gray-200 dark:bg-gray-700 rounded-xl space-y-3">
        <div class="h-4 bg-gray-300 dark:bg-gray-600 rounded w-3/4"></div>
        <div class="h-3 bg-gray-300 dark:bg-gray-600 rounded w-1/2"></div>
        <div class="flex gap-2">
          <div class="h-6 w-16 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
          <div class="h-6 w-16 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
        </div>
      </div>
    }
  } @else {
    @for (i of rowsArray; track i) {
      <div class="flex items-center gap-3 p-3">
        <div class="w-8 h-8 bg-gray-200 dark:bg-gray-700 rounded-full flex-shrink-0"></div>
        <div class="flex-1 space-y-2">
          <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
          <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/2"></div>
        </div>
      </div>
    }
  }
</div>
