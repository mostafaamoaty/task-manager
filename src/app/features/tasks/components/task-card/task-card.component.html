<ng-container *transloco="let t; read: 'tasks'">
  <div
    class="rounded-xl p-4 shadow-sm border hover:shadow-md transition-all select-none"
    [class.bg-white]="task.priority !== 'high'"
    [class.dark:bg-gray-800]="task.priority !== 'high'"
    [class.bg-red-50]="task.priority === 'high'"
    [class.dark:bg-red-950]="task.priority === 'high'"
    [class.border-gray-100]="!dragging()"
    [class.dark:border-gray-700]="!dragging()"
    [class.hover:border-blue-300]="!dragging()"
    [class.dark:hover:border-blue-500]="!dragging()"
    [class.border-blue-400]="dragging()"
    [class.dark:border-blue-400]="dragging()"
    [class.cursor-grab]="!dragging()"
    [class.cursor-grabbing]="dragging()"
    [style.border-left]="task.priority === 'high' ? '4px solid #D32F2F' : ''"
    (mousedown)="dragging.set(true)"
    (mouseup)="dragging.set(false)"
    (mouseleave)="dragging.set(false)"
  >
    <div class="flex items-start justify-between gap-2 mb-2">
      <app-priority-badge [priority]="task.priority" />
      <div class="relative flex-shrink-0">
        <button (click)="toggleMenu($event)"
          class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors rounded cursor-pointer"
          [attr.aria-label]="'Actions for ' + task.title">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5" />
            <circle cx="12" cy="12" r="1.5" />
            <circle cx="12" cy="19" r="1.5" />
          </svg>
        </button>
        @if (menuOpen()) {
        <div
          class="absolute right-0 top-7 z-10 w-36 bg-white dark:bg-gray-700 rounded-lg shadow-lg border border-gray-100 dark:border-gray-600 py-1">
          <button (click)="edit.emit(task); menuOpen.set(false)"
            class="flex items-center gap-2 w-full px-3 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Edit
          </button>
          <button (click)="delete.emit(task); menuOpen.set(false)"
            class="flex items-center gap-2 w-full px-3 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Delete
          </button>
        </div>
        }
      </div>
    </div>

    <!-- Title -->
    <h3 class="text-sm font-semibold text-gray-900 dark:text-white mb-2">
      {{ task.title }}
    </h3>

    <!-- Description -->
    <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">
      {{ task.description | truncate: 80 }}
    </p>

    <!-- Tags -->
    @if (task.tags.length > 0) {
    <div class="flex flex-wrap gap-1 mb-3">
      @for (tag of task.tags; track tag) {
      <span class="px-2 py-0.5 text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-full">
        {{ tag }}
      </span>
      }
    </div>
    }

    <!-- Footer -->
    <div class="flex items-center justify-between pt-2 border-t border-gray-100 dark:border-gray-700">
      <app-user-avatar [user]="task.assignee" size="sm" [showHandle]="true" />
      <span class="text-xs" [class.text-red-500]="task.isOverdue" [class.text-gray-500]="!task.isOverdue">
        📅 {{ dueDateLabel(task.dueDate) }}
      </span>
    </div>
  </div>
</ng-container>
