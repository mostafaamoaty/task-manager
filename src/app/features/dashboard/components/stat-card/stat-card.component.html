<div
  class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex items-start gap-4"
  [style.border-left]="'4px solid ' + stat.color"
>
  <div
    class="text-3xl w-12 h-12 flex items-center justify-center rounded-lg flex-shrink-0"
    [style.background-color]="stat.color + '20'"
  >
    {{ stat.icon }}
  </div>
  <div class="flex-1 min-w-0">
    <p class="text-sm text-gray-500 dark:text-gray-400 truncate">{{ stat.title }}</p>
    <p class="text-2xl font-bold text-gray-900 dark:text-white">{{ stat.value }}</p>
    <p class="text-xs mt-1 flex items-center gap-1">
      <span
        class="font-semibold"
        [class.text-green-600]="stat.changeType === 'positive'"
        [class.text-red-500]="stat.changeType === 'negative'"
        [class.text-gray-500]="stat.changeType === 'neutral'"
      >
        {{ stat.change }}
      </span>
      <span class="text-gray-400 dark:text-gray-500">{{ stat.changeLabel }}</span>
    </p>
  </div>
</div>
